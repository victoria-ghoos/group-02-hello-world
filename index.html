<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello World!</title>
  <!-- Absolute paths on purpose: they only resolve if the site is served from the root of its own host (subdomain routing, routing.md §4.2). -->
  <link rel="stylesheet" href="/style.css">
  <!-- Explicit icon, so the browser does not request /favicon.ico and log a 404. -->
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
</head>
<body>
  <main>
    <img src="/logo.svg" alt="Group 02 logo" width="96" height="96">
    <h1>Hello World!</h1>
    <p>Reference project for scenario 1: a static site deployed by the group 02 platform.</p>
  </main>
</body>
</html>
